  <defs>
    <radialGradient id="bg"><stop stop-color="#405d25"/><stop offset="1" stop-color="#101a15"/></radialGradient>
    <linearGradient id="lime"><stop stop-color="#f4ffc9"/><stop offset=".5" stop-color="#d8ff70"/><stop offset="1" stop-color="#6fbc6c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
